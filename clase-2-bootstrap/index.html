<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram Card</title>

    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="bg-dark d-flex justify-content-center align-items-center vh-100">
    <div class="card border border-0" style="width: 22rem">
        <!-- Header -->
        <div class="card-header d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="fa-brands fa-html5 fa-lg"></i>
                <strong>Rigoberto</strong>
            </div>
            <i class="fa-solid fa-ellipsis"></i>
        </div>

        <!-- Image -->
        <img src="./seebensee-2384369.webp" class="card-img-top border border-0 rounded-0" alt="Paisaje" />

        <!-- Actions -->
        <div class="card-body py-2">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div class="d-flex gap-3 fs-5">
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-regular fa-comment"></i>
                    <i class="fa-regular fa-paper-plane"></i>
                </div>
                <i class="fa-regular fa-bookmark"></i>
            </div>

            <!-- Likes -->
            <p class="mb-1">
                Liked by <strong>4GeeksAcademy</strong>, <strong>html5</strong>,
                <strong>Web</strong> and <strong>100,000 others</strong>
            </p>

            <!-- Text -->
            <p class="mb-0 text-muted">
                Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam
                nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat
                volutpat.
            </p>
        </div>
    </div>
</body>

</html>
